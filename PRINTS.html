<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print · Academia Pulse</title>
<link rel="stylesheet" href="prints.css">
<style>
body{background:#fff;padding:16px 12px 32px}
.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}
.bloco h2{display:none}
.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}
.tb{background:#b91c1c}
.btn.main{background:#b91c1c}
</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Pulse</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <span class="chip on">Todos</span><span class="chip">Peito</span><span class="chip">Perna</span><span class="chip">Costas</span>
        <div class="item" style="margin-top:8px;"><div><strong>Supino</strong><div class="muted">Peito · 3x10</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Agachamento</strong><div class="muted">Perna · 4x8</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Remada</strong><div class="muted">Costas · 3x12</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Prancha</strong><div class="muted">Core · 3x40s</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Treino (2)</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Treino do dia</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="item"><div><strong>Supino</strong></div><span class="muted">Peito</span></div>
        <div class="item"><div><strong>Agachamento</strong></div><span class="muted">Perna</span></div>
        <div class="aviso erro">Mínimo 3 exercícios para fechar</div>
        <button class="btn ghost">Registrar treino</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
